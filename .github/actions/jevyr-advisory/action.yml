name: Jevyr advisory case
description: Seal an exact checked-out commit into an isolated Jevyr runtime and export public, advisory proof material.
inputs:
  impulse:
    description: The complete non-secret one-shot impulse. It is sealed, exported in sealed.json, and cannot be continued.
    required: true
  subject-sha:
    description: Full Git commit SHA that must equal HEAD.
    required: true
  trusted-runtime-sha:
    description: Full Git commit SHA that must equal the checkout containing this action and Bone policy.
    required: true
  subject-directory:
    description: Exact checked-out subject repository, separate from this trusted action runtime.
    required: true
  data-directory:
    description: Optional new private-state directory below RUNNER_TEMP. Defaults to a unique runner-temporary path and is never uploaded.
    required: false
    default: ""
  public-directory:
    description: Optional new public-export directory below RUNNER_TEMP. Defaults to a unique runner-temporary path.
    required: false
    default: ""
  forge-plan:
    description: Optional relative pre-sealed Forge plan path contained in the verified trusted-runtime checkout.
    required: false
    default: ""
  assay-frontier:
    description: Optional relative pre-sealed jevyr.assay-frontier/1 path contained in the verified trusted-runtime checkout.
    required: false
    default: ""
outputs:
  case-id:
    description: Sealed Jevyr case identifier.
    value: ${{ steps.run.outputs.case-id }}
  record-path:
    description: Path to the canonical Record payload.
    value: ${{ steps.run.outputs.record-path }}
  record-envelope-path:
    description: Path to the signed DSSE Record envelope.
    value: ${{ steps.run.outputs.record-envelope-path }}
  terminal-path:
    description: Path to the canonical signed terminal-closure payload.
    value: ${{ steps.run.outputs.terminal-path }}
  terminal-envelope-path:
    description: Path to the DSSE terminal-closure envelope.
    value: ${{ steps.run.outputs.terminal-envelope-path }}
  replay-path:
    description: Path to the independent persisted-evidence replay report.
    value: ${{ steps.run.outputs.replay-path }}
  public-directory:
    description: Directory containing only exportable proof material.
    value: ${{ steps.run.outputs.public-directory }}
  bundle-archive-path:
    description: Path to the single verified tar archive intended for publication.
    value: ${{ steps.run.outputs.bundle-archive-path }}
  bundle-archive-digest:
    description: SHA-256 digest of the exact tar archive intended for publication.
    value: ${{ steps.run.outputs.bundle-archive-digest }}
  source-sha:
    description: Verified source commit.
    value: ${{ steps.run.outputs.source-sha }}
  runtime-sha:
    description: Verified Jevyr runtime commit.
    value: ${{ steps.run.outputs.runtime-sha }}
  key-id:
    description: Verified DSSE Ed25519 key ID; pin this value out of band for offline authenticity.
    value: ${{ steps.run.outputs.key-id }}
runs:
  using: composite
  steps:
    - name: Set up the pinned Jevyr Node runtime
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24.16.0

    - name: Verify exact immutable subject
      shell: bash
      env:
        JEVYR_EXPECTED_SHA: ${{ inputs.subject-sha }}
        JEVYR_SUBJECT_INPUT: ${{ inputs.subject-directory }}
      run: |
        set -euo pipefail
        umask 077
        if ! grep -Eq '^[a-f0-9]{40}([a-f0-9]{24})?$' <<<"$JEVYR_EXPECTED_SHA"; then
          echo "The subject SHA is not a full canonical Git object id." >&2
          exit 1
        fi
        JEVYR_WORKSPACE_ROOT=$(realpath -e -- "$GITHUB_WORKSPACE")
        case "$JEVYR_SUBJECT_INPUT" in
          /*) JEVYR_SUBJECT_ROOT="$JEVYR_SUBJECT_INPUT" ;;
          *) JEVYR_SUBJECT_ROOT="$JEVYR_WORKSPACE_ROOT/$JEVYR_SUBJECT_INPUT" ;;
        esac
        JEVYR_SUBJECT_ROOT=$(realpath -e -- "$JEVYR_SUBJECT_ROOT")
        case "$JEVYR_SUBJECT_ROOT/" in
          "$JEVYR_WORKSPACE_ROOT/"*) ;;
          *) echo "The subject checkout must remain inside GITHUB_WORKSPACE." >&2; exit 1 ;;
        esac
        if [[ ! -d "$JEVYR_SUBJECT_ROOT/.git" || -L "$JEVYR_SUBJECT_ROOT/.git" ]]; then
          echo "The subject must be a standalone checkout with a real .git directory." >&2
          exit 1
        fi
        git_subject() {
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" LANG=C.UTF-8 \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_ATTR_NOSYSTEM=1 \
            GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
            git -c core.fsmonitor=false -c core.hooksPath=/dev/null \
            -C "$JEVYR_SUBJECT_ROOT" "$@"
        }
        JEVYR_REPORTED_SUBJECT_ROOT=$(git_subject rev-parse --show-toplevel)
        JEVYR_REPORTED_SUBJECT_ROOT=$(realpath -e -- "$JEVYR_REPORTED_SUBJECT_ROOT")
        test "$JEVYR_SUBJECT_ROOT" = "$JEVYR_REPORTED_SUBJECT_ROOT"
        JEVYR_OBSERVED_SUBJECT_SHA=$(git_subject rev-parse --verify 'HEAD^{commit}')
        test "$JEVYR_EXPECTED_SHA" = "$JEVYR_OBSERVED_SUBJECT_SHA"
        JEVYR_SUBJECT_STATUS=$(git_subject status --porcelain=v2 --untracked-files=all --ignore-submodules=none)
        test -z "$JEVYR_SUBJECT_STATUS"
        git_subject ls-files --others --ignored --exclude-standard -z > "$RUNNER_TEMP/jevyr-source-ignored-before"
        test ! -s "$RUNNER_TEMP/jevyr-source-ignored-before"
        {
          git_subject rev-parse --verify 'HEAD^{commit}'
          git_subject rev-parse --verify 'HEAD^{tree}'
          git_subject ls-files --stage -z
          git_subject diff --no-ext-diff --no-textconv --binary HEAD --
          git_subject ls-files --others --exclude-standard -z
        } | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/jevyr-source-before.sha256"
        git_subject ls-tree -r --full-tree -z "$JEVYR_EXPECTED_SHA" \
          > "$RUNNER_TEMP/jevyr-subject-tree.entries"
        git_subject rev-parse --verify 'HEAD^{tree}' > "$RUNNER_TEMP/jevyr-source-tree"
        printf '%s\n' "$JEVYR_SUBJECT_ROOT" > "$RUNNER_TEMP/jevyr-subject-root"

    - name: Verify exact trusted Jevyr runtime
      shell: bash
      env:
        JEVYR_ACTION_ROOT_INPUT: ${{ github.action_path }}/../../..
        JEVYR_EXPECTED_RUNTIME_SHA: ${{ inputs.trusted-runtime-sha }}
      run: |
        set -euo pipefail
        umask 077
        if ! grep -Eq '^[a-f0-9]{40}([a-f0-9]{24})?$' <<<"$JEVYR_EXPECTED_RUNTIME_SHA"; then
          echo "The trusted runtime SHA is not a full canonical Git object id." >&2
          exit 1
        fi
        JEVYR_WORKSPACE_ROOT=$(realpath -e -- "$GITHUB_WORKSPACE")
        JEVYR_ACTION_ROOT=$(realpath -e -- "$JEVYR_ACTION_ROOT_INPUT")
        case "$JEVYR_ACTION_ROOT/" in
          "$JEVYR_WORKSPACE_ROOT/"*) ;;
          *) echo "The trusted runtime checkout must remain inside GITHUB_WORKSPACE." >&2; exit 1 ;;
        esac
        if [[ ! -d "$JEVYR_ACTION_ROOT/.git" || -L "$JEVYR_ACTION_ROOT/.git" ]]; then
          echo "The trusted runtime must be a standalone checkout with a real .git directory." >&2
          exit 1
        fi
        git_runtime() {
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" LANG=C.UTF-8 \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_ATTR_NOSYSTEM=1 \
            GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
            git -c core.fsmonitor=false -c core.hooksPath=/dev/null \
            -C "$JEVYR_ACTION_ROOT" "$@"
        }
        JEVYR_REPORTED_RUNTIME_ROOT=$(git_runtime rev-parse --show-toplevel)
        JEVYR_REPORTED_RUNTIME_ROOT=$(realpath -e -- "$JEVYR_REPORTED_RUNTIME_ROOT")
        test "$JEVYR_ACTION_ROOT" = "$JEVYR_REPORTED_RUNTIME_ROOT"
        JEVYR_OBSERVED_RUNTIME_SHA=$(git_runtime rev-parse --verify 'HEAD^{commit}')
        test "$JEVYR_EXPECTED_RUNTIME_SHA" = "$JEVYR_OBSERVED_RUNTIME_SHA"
        JEVYR_RUNTIME_STATUS=$(git_runtime status --porcelain=v2 --untracked-files=all --ignore-submodules=none)
        test -z "$JEVYR_RUNTIME_STATUS"
        git_runtime ls-files --others --ignored --exclude-standard -z > "$RUNNER_TEMP/jevyr-runtime-ignored-before"
        test ! -s "$RUNNER_TEMP/jevyr-runtime-ignored-before"
        if [[ -e "$JEVYR_ACTION_ROOT/.jevyr" || -L "$JEVYR_ACTION_ROOT/.jevyr" ]]; then
          if [[ ! -d "$JEVYR_ACTION_ROOT/.jevyr" || -L "$JEVYR_ACTION_ROOT/.jevyr" ]]; then
            echo "The trusted .jevyr authority root must be a real directory." >&2
            exit 1
          fi
          JEVYR_RUNTIME_CONTROL_LINK=$(find "$JEVYR_ACTION_ROOT/.jevyr" -type l -print -quit)
          if [[ -n "$JEVYR_RUNTIME_CONTROL_LINK" ]]; then
            echo "The trusted .jevyr authority namespace must not contain symbolic links." >&2
            exit 1
          fi
        fi
        JEVYR_SUBJECT_ROOT=$(cat "$RUNNER_TEMP/jevyr-subject-root")
        if [[ "$JEVYR_SUBJECT_ROOT" == "$JEVYR_ACTION_ROOT" \
          || "$JEVYR_SUBJECT_ROOT" == "$JEVYR_ACTION_ROOT/"* \
          || "$JEVYR_ACTION_ROOT" == "$JEVYR_SUBJECT_ROOT/"* ]]; then
          echo "The subject and trusted runtime checkouts must be disjoint." >&2
          exit 1
        fi
        JEVYR_RUNTIME_IGNORE="$JEVYR_ACTION_ROOT/.jevyrignore"
        JEVYR_SUBJECT_IGNORE="$JEVYR_SUBJECT_ROOT/.jevyrignore"
        if [[ -L "$JEVYR_RUNTIME_IGNORE" || -L "$JEVYR_SUBJECT_IGNORE" ]]; then
          echo ".jevyrignore must not be a symbolic link in either checkout." >&2
          exit 1
        fi
        if [[ -f "$JEVYR_RUNTIME_IGNORE" ]]; then
          if [[ ! -f "$JEVYR_SUBJECT_IGNORE" ]] \
            || ! cmp -s -- "$JEVYR_RUNTIME_IGNORE" "$JEVYR_SUBJECT_IGNORE"; then
            echo "The proposed commit cannot change the capture ignore policy for its own run." >&2
            exit 1
          fi
        elif [[ -e "$JEVYR_RUNTIME_IGNORE" ]]; then
          echo "The trusted .jevyrignore path is not a regular file." >&2
          exit 1
        elif [[ -e "$JEVYR_SUBJECT_IGNORE" ]]; then
          echo "The proposed commit cannot introduce a capture ignore policy for its own run." >&2
          exit 1
        fi
        if [[ -f "$JEVYR_RUNTIME_IGNORE" ]]; then
          sha256sum "$JEVYR_RUNTIME_IGNORE" | cut -d' ' -f1 > "$RUNNER_TEMP/jevyr-ignore-policy.sha256"
        else
          printf 'absent\n' > "$RUNNER_TEMP/jevyr-ignore-policy.sha256"
        fi
        if [[ ! -f "$JEVYR_ACTION_ROOT/pnpm-lock.yaml" || -L "$JEVYR_ACTION_ROOT/pnpm-lock.yaml" ]]; then
          echo "The trusted runtime lockfile must be one regular, non-symlink file." >&2
          exit 1
        fi
        git_runtime rev-parse --verify 'HEAD^{tree}' > "$RUNNER_TEMP/jevyr-runtime-tree"
        sha256sum "$JEVYR_ACTION_ROOT/pnpm-lock.yaml" | cut -d' ' -f1 > "$RUNNER_TEMP/jevyr-runtime-lock.sha256"
        {
          git_runtime rev-parse --verify 'HEAD^{commit}'
          git_runtime rev-parse --verify 'HEAD^{tree}'
          git_runtime ls-files --stage -z
          git_runtime diff --no-ext-diff --no-textconv --binary HEAD --
        } | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/jevyr-runtime-before.sha256"
        JEVYR_TREE_GUARD_SOURCE="$JEVYR_ACTION_ROOT/.github/actions/jevyr-advisory/filesystem-manifest.mjs"
        if [[ ! -f "$JEVYR_TREE_GUARD_SOURCE" || -L "$JEVYR_TREE_GUARD_SOURCE" ]] \
          || ! git_runtime ls-files --error-unmatch -- ".github/actions/jevyr-advisory/filesystem-manifest.mjs" >/dev/null; then
          echo "The filesystem-byte verifier must be one regular file tracked by the trusted runtime commit." >&2
          exit 1
        fi
        git_runtime ls-tree -r --full-tree -z "$JEVYR_EXPECTED_RUNTIME_SHA" \
          > "$RUNNER_TEMP/jevyr-runtime-tree.entries"
        install -m 0400 -- "$JEVYR_TREE_GUARD_SOURCE" "$RUNNER_TEMP/jevyr-filesystem-manifest.mjs"
        node "$RUNNER_TEMP/jevyr-filesystem-manifest.mjs" paths-from-tree \
          "$RUNNER_TEMP/jevyr-runtime-tree.entries" "$RUNNER_TEMP/jevyr-runtime-tracked.paths"
        node "$RUNNER_TEMP/jevyr-filesystem-manifest.mjs" paths-from-tree \
          "$RUNNER_TEMP/jevyr-subject-tree.entries" "$RUNNER_TEMP/jevyr-subject-tracked.paths"
        node "$RUNNER_TEMP/jevyr-filesystem-manifest.mjs" capture \
          "$JEVYR_ACTION_ROOT" "$RUNNER_TEMP/jevyr-runtime-tracked.paths" \
          "$RUNNER_TEMP/jevyr-runtime-filesystem.json" tracked
        node "$RUNNER_TEMP/jevyr-filesystem-manifest.mjs" capture \
          "$JEVYR_SUBJECT_ROOT" "$RUNNER_TEMP/jevyr-subject-tracked.paths" \
          "$RUNNER_TEMP/jevyr-subject-filesystem.json" complete-worktree
        printf '%s\n' "$JEVYR_ACTION_ROOT" > "$RUNNER_TEMP/jevyr-action-root"
        printf '%s\n' "$JEVYR_EXPECTED_RUNTIME_SHA" > "$RUNNER_TEMP/jevyr-runtime-sha"

    - name: Build pinned Jevyr action runtime
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        JEVYR_ACTION_ROOT=$(cat "$RUNNER_TEMP/jevyr-action-root")
        JEVYR_SUBJECT_ROOT=$(cat "$RUNNER_TEMP/jevyr-subject-root")
        JEVYR_TREE_GUARD="$RUNNER_TEMP/jevyr-filesystem-manifest.mjs"
        JEVYR_RUNTIME_FILESYSTEM="$RUNNER_TEMP/jevyr-runtime-filesystem.json"
        JEVYR_SUBJECT_FILESYSTEM="$RUNNER_TEMP/jevyr-subject-filesystem.json"
        JEVYR_TREE_GUARD_IDENTITY=$(sha256sum < "$JEVYR_TREE_GUARD")
        JEVYR_RUNTIME_FILESYSTEM_IDENTITY=$(sha256sum < "$JEVYR_RUNTIME_FILESYSTEM")
        JEVYR_SUBJECT_FILESYSTEM_IDENTITY=$(sha256sum < "$JEVYR_SUBJECT_FILESYSTEM")
        JEVYR_BUILD_HOME=$(mktemp -d "$RUNNER_TEMP/jevyr-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")
        mkdir -m 0700 -- "$JEVYR_BUILD_HOME/tmp" "$JEVYR_BUILD_HOME/cache" "$JEVYR_BUILD_HOME/corepack"
        build_environment=(
          env -i
          "PATH=$PATH"
          "HOME=$JEVYR_BUILD_HOME"
          "TMPDIR=$JEVYR_BUILD_HOME/tmp"
          "XDG_CACHE_HOME=$JEVYR_BUILD_HOME/cache"
          "COREPACK_HOME=$JEVYR_BUILD_HOME/corepack"
          "LANG=C.UTF-8"
          "CI=true"
          "NEXT_TELEMETRY_DISABLED=1"
        )
        (
          cd "$JEVYR_ACTION_ROOT"
          JEVYR_NODE_VERSION=$("${build_environment[@]}" node --version)
          test "$JEVYR_NODE_VERSION" = "v24.16.0"
          JEVYR_PNPM_VERSION=$("${build_environment[@]}" corepack pnpm --version)
          test "$JEVYR_PNPM_VERSION" = "10.17.1"
          "${build_environment[@]}" corepack pnpm install --frozen-lockfile
          "${build_environment[@]}" corepack pnpm build
        )
        test "$JEVYR_TREE_GUARD_IDENTITY" = "$(sha256sum < "$JEVYR_TREE_GUARD")"
        test "$JEVYR_RUNTIME_FILESYSTEM_IDENTITY" = "$(sha256sum < "$JEVYR_RUNTIME_FILESYSTEM")"
        test "$JEVYR_SUBJECT_FILESYSTEM_IDENTITY" = "$(sha256sum < "$JEVYR_SUBJECT_FILESYSTEM")"
        node "$JEVYR_TREE_GUARD" verify "$JEVYR_ACTION_ROOT" "$JEVYR_RUNTIME_FILESYSTEM"
        node "$JEVYR_TREE_GUARD" verify "$JEVYR_SUBJECT_ROOT" "$JEVYR_SUBJECT_FILESYSTEM"
        node "$JEVYR_TREE_GUARD" verify-subtree "$JEVYR_ACTION_ROOT" "$JEVYR_RUNTIME_FILESYSTEM" .jevyr
        git_runtime() {
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" LANG=C.UTF-8 \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_ATTR_NOSYSTEM=1 \
            GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
            git -c core.fsmonitor=false -c core.hooksPath=/dev/null \
            -C "$JEVYR_ACTION_ROOT" "$@"
        }
        JEVYR_RECORDED_RUNTIME_SHA=$(<"$RUNNER_TEMP/jevyr-runtime-sha")
        JEVYR_OBSERVED_RUNTIME_SHA=$(git_runtime rev-parse --verify 'HEAD^{commit}')
        test "$JEVYR_RECORDED_RUNTIME_SHA" = "$JEVYR_OBSERVED_RUNTIME_SHA"
        JEVYR_RUNTIME_STATUS=$(git_runtime status --porcelain=v2 --untracked-files=no --ignore-submodules=none)
        test -z "$JEVYR_RUNTIME_STATUS"
        JEVYR_RUNTIME_CONTROL_STATUS=$(git_runtime status --porcelain=v2 --untracked-files=all --ignore-submodules=none -- .jevyr)
        if [[ -n "$JEVYR_RUNTIME_CONTROL_STATUS" ]]; then
          echo "The build created or changed authority-bearing files in the trusted .jevyr namespace." >&2
          exit 1
        fi
        JEVYR_RUNTIME_IGNORED_CONTROLS=$(git_runtime ls-files --others --ignored --exclude-standard -- .jevyr)
        if [[ -n "$JEVYR_RUNTIME_IGNORED_CONTROLS" ]]; then
          echo "The build created ignored authority-bearing files in the trusted .jevyr namespace." >&2
          exit 1
        fi
        if [[ -e "$JEVYR_ACTION_ROOT/.jevyr" || -L "$JEVYR_ACTION_ROOT/.jevyr" ]]; then
          if [[ ! -d "$JEVYR_ACTION_ROOT/.jevyr" || -L "$JEVYR_ACTION_ROOT/.jevyr" ]]; then
            echo "The build replaced the trusted .jevyr authority root with a non-directory or link." >&2
            exit 1
          fi
          JEVYR_RUNTIME_CONTROL_LINK=$(find "$JEVYR_ACTION_ROOT/.jevyr" -type l -print -quit)
          if [[ -n "$JEVYR_RUNTIME_CONTROL_LINK" ]]; then
            echo "The build left a symbolic link in the trusted .jevyr authority namespace." >&2
            exit 1
          fi
        fi
        {
          git_runtime rev-parse --verify 'HEAD^{commit}'
          git_runtime rev-parse --verify 'HEAD^{tree}'
          git_runtime ls-files --stage -z
          git_runtime diff --no-ext-diff --no-textconv --binary HEAD --
        } | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/jevyr-runtime-after.sha256"
        cmp "$RUNNER_TEMP/jevyr-runtime-before.sha256" "$RUNNER_TEMP/jevyr-runtime-after.sha256"
        JEVYR_IGNORE_IDENTITY=$(cat "$RUNNER_TEMP/jevyr-ignore-policy.sha256")
        if [[ "$JEVYR_IGNORE_IDENTITY" == "absent" ]]; then
          if [[ -e "$JEVYR_ACTION_ROOT/.jevyrignore" || -L "$JEVYR_ACTION_ROOT/.jevyrignore" ]]; then
            echo "The trusted runtime ignore policy changed during the build." >&2
            exit 1
          fi
        else
          if [[ ! -f "$JEVYR_ACTION_ROOT/.jevyrignore" || -L "$JEVYR_ACTION_ROOT/.jevyrignore" ]]; then
            echo "The trusted runtime ignore policy is no longer a regular, non-symlink file." >&2
            exit 1
          fi
          JEVYR_OBSERVED_IGNORE_IDENTITY=$(sha256sum "$JEVYR_ACTION_ROOT/.jevyrignore" | cut -d' ' -f1)
          test "$JEVYR_IGNORE_IDENTITY" = "$JEVYR_OBSERVED_IGNORE_IDENTITY"
        fi
        node "$JEVYR_TREE_GUARD" capture-all \
          "$JEVYR_ACTION_ROOT" "$RUNNER_TEMP/jevyr-runtime-execution-filesystem.json"
        node "$JEVYR_TREE_GUARD" verify \
          "$JEVYR_ACTION_ROOT" "$RUNNER_TEMP/jevyr-runtime-execution-filesystem.json"

    - name: Cast, observe, and export public proofs
      id: run
      shell: bash
      env:
        JEVYR_DATA_INPUT: ${{ inputs.data-directory }}
        JEVYR_PUBLIC_INPUT: ${{ inputs.public-directory }}
        JEVYR_FORGE_PLAN_INPUT: ${{ inputs.forge-plan }}
        JEVYR_ASSAY_FRONTIER_INPUT: ${{ inputs.assay-frontier }}
        JEVYR_EXPECTED_SHA: ${{ inputs.subject-sha }}
        JEVYR_IMPULSE: ${{ inputs.impulse }}
        JEVYR_WORKFLOW_SHA: ${{ github.workflow_sha }}
        JEVYR_RUNTIME_REPOSITORY: ${{ github.repository }}
        JEVYR_SUBJECT_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        JEVYR_EVENT_NAME: ${{ github.event_name }}
        JEVYR_RUN_ID: ${{ github.run_id }}
        JEVYR_RUN_ATTEMPT: ${{ github.run_attempt }}
        JEVYR_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}
      run: |
        set -euo pipefail
        set -C
        umask 077
        JEVYR_ACTION_ROOT=$(cat "$RUNNER_TEMP/jevyr-action-root")
        JEVYR_RUNTIME_SHA=$(cat "$RUNNER_TEMP/jevyr-runtime-sha")
        JEVYR_RUNTIME_TREE=$(cat "$RUNNER_TEMP/jevyr-runtime-tree")
        JEVYR_RUNTIME_LOCK_DIGEST=$(cat "$RUNNER_TEMP/jevyr-runtime-lock.sha256")
        JEVYR_SUBJECT_ROOT=$(cat "$RUNNER_TEMP/jevyr-subject-root")
        JEVYR_SUBJECT_TREE=$(cat "$RUNNER_TEMP/jevyr-source-tree")
        JEVYR_TEMP_ROOT=$(realpath -e -- "$RUNNER_TEMP")
        JEVYR_TREE_GUARD="$RUNNER_TEMP/jevyr-filesystem-manifest.mjs"
        JEVYR_RUNTIME_FILESYSTEM="$RUNNER_TEMP/jevyr-runtime-filesystem.json"
        JEVYR_RUNTIME_EXECUTION_FILESYSTEM="$RUNNER_TEMP/jevyr-runtime-execution-filesystem.json"
        JEVYR_SUBJECT_FILESYSTEM="$RUNNER_TEMP/jevyr-subject-filesystem.json"
        git_runtime() {
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" LANG=C.UTF-8 \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_ATTR_NOSYSTEM=1 \
            GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
            git -c core.fsmonitor=false -c core.hooksPath=/dev/null \
            -C "$JEVYR_ACTION_ROOT" "$@"
        }
        verify_runtime_control_namespace() {
          local control_status ignored_controls
          node "$JEVYR_TREE_GUARD" verify-subtree \
            "$JEVYR_ACTION_ROOT" "$JEVYR_RUNTIME_FILESYSTEM" .jevyr
          if [[ -e "$JEVYR_ACTION_ROOT/.jevyr" || -L "$JEVYR_ACTION_ROOT/.jevyr" ]]; then
            if [[ ! -d "$JEVYR_ACTION_ROOT/.jevyr" || -L "$JEVYR_ACTION_ROOT/.jevyr" ]]; then
              echo "The trusted .jevyr authority root is not a real directory." >&2
              return 1
            fi
            local control_link
            control_link=$(find "$JEVYR_ACTION_ROOT/.jevyr" -type l -print -quit)
            if [[ -n "$control_link" ]]; then
              echo "The trusted .jevyr authority namespace contains a symbolic link." >&2
              return 1
            fi
          fi
          control_status=$(git_runtime status --porcelain=v2 --untracked-files=all --ignore-submodules=none -- .jevyr)
          if [[ -n "$control_status" ]]; then
            echo "The trusted .jevyr authority namespace differs from the exact runtime commit." >&2
            return 1
          fi
          ignored_controls=$(git_runtime ls-files --others --ignored --exclude-standard -- .jevyr)
          if [[ -n "$ignored_controls" ]]; then
            echo "The trusted .jevyr authority namespace contains ignored non-commit material." >&2
            return 1
          fi
        }
        node "$JEVYR_TREE_GUARD" verify "$JEVYR_ACTION_ROOT" "$JEVYR_RUNTIME_FILESYSTEM"
        node "$JEVYR_TREE_GUARD" verify "$JEVYR_ACTION_ROOT" "$JEVYR_RUNTIME_EXECUTION_FILESYSTEM"
        node "$JEVYR_TREE_GUARD" verify "$JEVYR_SUBJECT_ROOT" "$JEVYR_SUBJECT_FILESYSTEM"
        verify_runtime_control_namespace
        new_temp_directory() {
          local input="$1"
          local prefix="$2"
          local candidate parent name resolved_parent created
          if test -z "$input"; then
            if ! created=$(mktemp -d "$JEVYR_TEMP_ROOT/${prefix}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX"); then
              echo "Jevyr could not allocate a fresh runner-temporary directory." >&2
              return 1
            fi
            if ! chmod 0700 "$created"; then
              echo "Jevyr could not protect its fresh runner-temporary directory." >&2
              return 1
            fi
            realpath -e -- "$created"
            return
          fi
          case "$input" in
            /*) candidate="$input" ;;
            *) candidate="$JEVYR_TEMP_ROOT/$input" ;;
