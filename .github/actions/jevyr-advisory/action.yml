          pullRequestNumber,
        };
        const provenanceBytes = readRegular(provenanceSource, "Canonical runtime provenance");
        const provenance = core.parseJsonBytes(provenanceBytes, "Canonical runtime provenance");
        const provenanceText = sdk.canonicalJson(expectedProvenance);
        if (
          sdk.canonicalJson(provenance) !== provenanceText
          || !provenanceBytes.equals(Buffer.from(provenanceText, "utf8"))
        ) throw new Error("Runtime provenance changed after it was prepared for Seal");
        const requestExpectationBytes = Buffer.from(requestExpectationJson, "utf8");
        const requestExpectation = core.parseJsonBytes(requestExpectationBytes, "Request expectation");
        exactKeys(requestExpectation, [
          "protocol", "impulseDigest", "impulseBytes", "submissionDigest",
          "normalizedIntentDigest", "seed", "sourceSnapshotDigest",
        ], "Request expectation");
        if (
          requestExpectation.protocol !== "jevyr.github-advisory-request-expectation/1"
          || !/^sha256:[a-f0-9]{64}$/u.test(requestExpectation.impulseDigest)
          || !Number.isSafeInteger(requestExpectation.impulseBytes) || requestExpectation.impulseBytes < 1
          || !/^sha256:[a-f0-9]{64}$/u.test(requestExpectation.submissionDigest)
          || !/^sha256:[a-f0-9]{64}$/u.test(requestExpectation.normalizedIntentDigest)
          || !/^[a-f0-9]{32}$/u.test(requestExpectation.seed)
          || requestExpectation.seed !== requestExpectation.submissionDigest.slice("sha256:".length, "sha256:".length + 32)
          || !/^sha256:[a-f0-9]{64}$/u.test(requestExpectation.sourceSnapshotDigest)
        ) throw new Error("Request expectation is malformed");

        const sealedPath = join(stateDir, "cases", caseId, "sealed.json");
        const sealed = sdk.assertSealedCase(core.parseJsonBytes(
          readRegular(sealedPath, "Persisted immutable Case"),
          "Persisted immutable Case",
        ));
        const [sourceReference, provenanceReference] = sealed.intent.subjects;
        const [sourceSnapshot, provenanceSnapshot] = sealed.subjects;
        const provenanceDigest = byteDigest(provenanceBytes);
        const intentBytes = Buffer.from(sdk.canonicalJson(sealed.intent), "utf8");
        const intentImpulseBytes = Buffer.from(sealed.intent.impulse, "utf8");
        const contractImpulseBytes = Buffer.from(sealed.intentContract.originalImpulse, "utf8");
        const recompiledIntentContract = core.compileIntentContract({
          impulse: sealed.intent.impulse,
          constraints: [],
          requestedAssays: [],
          subjectIds: ["subject-1", "subject-2"],
        });
        exactKeys(sealed.intent, [
          "impulse", "mode", "subjects", "constraints", "requestedAssays",
          "privacy", "control", "seed",
        ], "Normalized Case intent");
        exactKeys(sourceReference, ["id", "kind", "locator", "revision"], "Git subject reference");
        exactKeys(provenanceReference, ["id", "kind", "locator"], "Provenance subject reference");
        exactKeys(sourceSnapshot, ["subjectId", "digest", "resolvedLocator", "revision", "capturedAt"], "Git subject snapshot");
        exactKeys(provenanceSnapshot, ["subjectId", "digest", "resolvedLocator", "capturedAt", "byteLength"], "Provenance subject snapshot");
        if (
          sealed.submissionDigest !== requestExpectation.submissionDigest
          || byteDigest(intentBytes) !== requestExpectation.normalizedIntentDigest
          || byteDigest(intentImpulseBytes) !== requestExpectation.impulseDigest
          || intentImpulseBytes.byteLength !== requestExpectation.impulseBytes
          || byteDigest(contractImpulseBytes) !== requestExpectation.impulseDigest
          || contractImpulseBytes.byteLength !== requestExpectation.impulseBytes
          || sealed.intentContract.originalImpulseDigest !== requestExpectation.impulseDigest
          || sealed.intentContract.originalImpulse !== sealed.intent.impulse
          || sdk.canonicalJson(sealed.intentContract) !== sdk.canonicalJson(recompiledIntentContract)
          || sealed.intent.seed !== requestExpectation.seed
          || sealed.intent.mode !== "auto" || sealed.intent.privacy !== "local_only"
          || sealed.intent.control !== "sovereign"
          || sealed.intent.constraints.length !== 0 || sealed.intent.requestedAssays.length !== 0
          || sdk.canonicalJson(sealed.intentContract.subjectIds) !== sdk.canonicalJson(["subject-1", "subject-2"])
          || sealed.intent.subjects.length !== 2 || sealed.subjects.length !== 2
          || sourceReference?.id !== "subject-1" || sourceReference.kind !== "git"
          || sourceReference.locator !== subjectRoot || sourceReference.revision !== subjectSha
          || provenanceReference?.id !== "subject-2" || provenanceReference.kind !== "text"
          || provenanceReference.locator !== provenanceText
          || Object.hasOwn(provenanceReference, "revision") || Object.hasOwn(provenanceReference, "mediaType")
          || sourceSnapshot?.subjectId !== "subject-1" || sourceSnapshot.revision !== subjectSha
          || sourceSnapshot.resolvedLocator !== subjectRoot
          || sourceSnapshot.digest !== requestExpectation.sourceSnapshotDigest
          || sourceSnapshot.capturedAt !== sealed.sealedAt
          || provenanceSnapshot?.subjectId !== "subject-2"
          || provenanceSnapshot.digest !== provenanceDigest
          || provenanceSnapshot.resolvedLocator !== "inline:subject-2"
          || provenanceSnapshot.byteLength !== provenanceBytes.byteLength
          || provenanceSnapshot.capturedAt !== sealed.sealedAt
        ) throw new Error("The immutable Case does not bind the exact one-shot request and subject snapshots");

        const [statusValue, trustValue, intentValue, policyValue, artifactIndexValue] = await Promise.all([
          json(`/v1/cases/${encodeURIComponent(caseId)}`),
          json("/v1/trust"),
          json(`/v1/cases/${encodeURIComponent(caseId)}/intent-contract`),
          json(`/v1/cases/${encodeURIComponent(caseId)}/policy-descriptor`),
          json(`/v1/cases/${encodeURIComponent(caseId)}/artifacts`),
        ]);
        const status = sdk.assertCaseStatus(statusValue);
        if (status.lifecycle !== "terminated" && status.lifecycle !== "invalid") {
          throw new Error("Proof export began before the Case reached a terminal status");
        }
        const trust = await sdk.assertPublicTrustBundle(trustValue);
        const intent = sdk.assertIntentContractPayload(intentValue);
        const policy = await sdk.assertCasePolicyDescriptor(policyValue, caseId);
        const artifactIndex = sdk.assertArtifactList(artifactIndexValue, caseId);
        writeJson("status.json", status);
        writeJson("trust.json", trust);
        writeJson("intent-contract.json", intent);
        writeJson("policy-descriptor.json", policy);
        writeJson("sealed.json", sealed);
        writeFileSync(join(output, "runtime-provenance.json"), provenanceBytes, { mode: 0o600, flag: "wx" });

        const events = [];
        let after = 0;
        let priorDigest = null;
        while (true) {
          const page = await sdk.assertLiveEventBatch(
            await json(`/v1/cases/${encodeURIComponent(caseId)}/events?after=${after}&waitMs=0&limit=2000`),
            after,
          );
          if (page.caseDigest !== status.caseDigest || page.runDigest !== status.runDigest) {
            throw new Error("Event export crossed the terminal Case identity");
          }
          if (page.events.length > 0 && page.events[0].priorDigest !== priorDigest) {
            throw new Error("Event export broke continuity across page boundaries");
          }
          events.push(...page.events);
          if (page.throughSequence < after || (page.throughSequence === after && !page.caughtUp)) {
            throw new Error("Event export made no monotonic progress");
          }
          after = page.throughSequence;
          priorDigest = page.events.at(-1)?.eventDigest ?? priorDigest;
          if (page.caughtUp) break;
        }
        if (
          events.length !== status.lastSequence
          || (events.length > 0 && events.at(-1)?.sequence !== status.lastSequence)
          || priorDigest !== status.headDigest
        ) throw new Error("Exported events do not equal the exact terminal ledger");
        writeJson("events.json", events);

        const artifactDir = join(output, "artifacts");
        mkdirSync(artifactDir, { recursive: false, mode: 0o700 });
        writeJson("artifacts/index.json", artifactIndex);
        let artifactBytes = 0;
        let previousArtifactId = "";
        const credentialArtifactNames = new Set([
          ".git-credentials", ".netrc", ".npmrc", ".pypirc", "_netrc",
          "application_default_credentials.json", "auth.json", "credentials",
          "credentials.ini", "credentials.json", "credentials.toml", "credentials.yaml",
          "credentials.yml", "id_dsa", "id_ecdsa", "id_ed25519", "id_rsa",
        ]);
        const isCredentialArtifactName = (name) => {
          const normalized = name.toLowerCase();
          return normalized === ".env" || normalized.startsWith(".env.")
            || credentialArtifactNames.has(normalized)
            || [".key", ".pem", ".p12", ".pfx"].some((suffix) => normalized.endsWith(suffix))
            || /^(?:\.?(?:credential|credentials|secret|secrets)|private[-_]?key|service[-_]?account)(?:[._-][a-z0-9_-]+)*$/u.test(normalized);
        };
        for (const meta of artifactIndex.artifacts) {
          if (previousArtifactId && previousArtifactId >= meta.id) {
            throw new Error("Artifact index is not in strict canonical identifier order");
          }
          if (isCredentialArtifactName(meta.name)) {
            throw new Error(`Artifact ${meta.id} has a credential-like logical name`);
          }
          previousArtifactId = meta.id;
          artifactBytes += meta.size;
          if (
            meta.size > MAX_ARTIFACT_RESPONSE_BYTES
            || !Number.isSafeInteger(artifactBytes)
            || artifactBytes > MAX_BUNDLE_BYTES
          ) {
            throw new Error("Artifact export exceeded its bounded byte budget");
          }
          const value = await response(`/v1/cases/${encodeURIComponent(caseId)}/artifacts/${encodeURIComponent(meta.id)}`);
          const bytes = await boundedBody(value, meta.size, `Artifact ${meta.id}`);
          const digest = `sha256:${createHash("sha256").update(bytes).digest("hex")}`;
          if (
            digest !== meta.digest ||
            bytes.byteLength !== meta.size ||
            value.headers.get("x-jevyr-digest") !== meta.digest ||
            value.headers.get("content-type") !== meta.mediaType ||
            value.headers.get("content-length") !== String(meta.size)
          ) throw new Error(`Artifact ${meta.id} failed export verification`);
          writeFileSync(join(artifactDir, `${meta.id}.blob`), bytes, { mode: 0o600, flag: "wx" });
        }
        const [finalStatusValue, finalArtifactIndexValue] = await Promise.all([
          json(`/v1/cases/${encodeURIComponent(caseId)}`),
          json(`/v1/cases/${encodeURIComponent(caseId)}/artifacts`),
        ]);
        const finalStatus = sdk.assertCaseStatus(finalStatusValue);
        const finalArtifactIndex = sdk.assertArtifactList(finalArtifactIndexValue, caseId);
        if (
          sdk.canonicalJson(finalStatus) !== sdk.canonicalJson(status)
          || sdk.canonicalJson(finalArtifactIndex) !== sdk.canonicalJson(artifactIndex)
        ) throw new Error("Terminal status or artifact closure changed during proof export");

        const seal = sdk.assertSealReceipt(readJson("seal.json"));
        const record = sdk.assertRecordPayload(readJson("record.json"));
        const terminal = sdk.assertTerminalReceipt(readJson("terminal.json"));
        const sealEnvelope = readJson("seal.dsse.json");
        const recordEnvelope = readJson("record.dsse.json");
        const terminalEnvelope = readJson("terminal.dsse.json");
        const verifiedSeal = await sdk.verifySealEnvelope(sealEnvelope, trust, seal);
        const verifiedRecord = await sdk.verifyRecordEnvelope(recordEnvelope, trust, record);
        const verifiedTerminal = await sdk.verifyTerminalEnvelope(terminalEnvelope, trust, terminal);
        const recordDigest = byteDigest(Buffer.from(sdk.canonicalJson(record), "utf8"));
        const artifactIndexDigest = byteDigest(Buffer.from(sdk.canonicalJson(artifactIndex), "utf8"));
        const closedAt = events.at(-1)?.observedAt ?? status.updatedAt;
        if (
          seal.caseId !== caseId
          || sdk.canonicalJson(core.sealReceipt(sealed)) !== sdk.canonicalJson(seal)
          || seal.caseDigest !== status.caseDigest
          || seal.runDigest !== status.runDigest
          || record.caseDigest !== seal.caseDigest
          || record.runDigest !== seal.runDigest
          || record.policyDigest !== seal.policyDigest
          || record.genomeDigest !== seal.genomeDigest
          || record.searchDigest !== seal.searchDigest
          || record.intentContractDigest !== seal.intentContractDigest
          || record.verdict.policyVersion !== seal.policyVersion
          || policy.artifact.descriptor.version !== seal.policyVersion
          || intent.digest !== seal.intentContractDigest
          || sdk.canonicalJson(intent) !== sdk.canonicalJson(sealed.intentContract)
          || verifiedSeal.keyId !== verifiedRecord.keyId
          || verifiedSeal.keyId !== verifiedTerminal.keyId
          || terminal.caseId !== caseId
          || terminal.caseDigest !== status.caseDigest
          || terminal.runDigest !== status.runDigest
          || terminal.lifecycle !== status.lifecycle
          || terminal.stage !== status.stage
          || terminal.stageStatus !== status.stageStatus
          || terminal.lastSequence !== status.lastSequence
          || terminal.eventHeadDigest !== status.headDigest
          || terminal.recordDigest !== recordDigest
          || terminal.artifactIndexDigest !== artifactIndexDigest
          || terminal.closedAt !== status.updatedAt
          || terminal.closedAt !== closedAt
        ) throw new Error("Exported signed commitments do not share one sealed Case and terminal ledger identity");
        writeFileSync(join(stateDir, "verified-key-id"), `${verifiedSeal.keyId}\n`, { mode: 0o600, flag: "wx" });
        sdk.assertPolicyDescriptorRecordBinding(policy, record);

        const replay = readJson("replay.json");
        if (
          replay?.valid !== true
          || replay?.expected !== record.eventHeadDigest
          || replay?.observed !== record.eventHeadDigest
          || replay?.terminalHead !== status.headDigest
          || replay?.events !== status.lastSequence
          || !Array.isArray(replay?.problems) || replay.problems.length !== 0
          || replay?.authenticity?.verification !== "dsse-ed25519"
          || replay?.authenticity?.keyId !== verifiedRecord.keyId
        ) throw new Error("Exported replay report does not prove this exact terminal bundle");

        const expectedRootEntries = [
          "artifacts", "events.json", "intent-contract.json", "policy-descriptor.json",
          "record.dsse.json", "record.json", "replay.json", "runtime-provenance.json",
          "seal.dsse.json", "seal.json", "sealed.json", "status.json",
          "terminal.dsse.json", "terminal.json", "trust.json",
        ].sort();
        const expectedArtifactEntries = [
          "index.json",
          ...artifactIndex.artifacts.map((meta) => `${meta.id}.blob`),
        ].sort();
        if (
          JSON.stringify(readdirSync(output).sort()) !== JSON.stringify(expectedRootEntries)
          || JSON.stringify(readdirSync(artifactDir).sort()) !== JSON.stringify(expectedArtifactEntries)
        ) throw new Error("The public proof directory does not have the closed bundle layout");
        NODE
        cleanup_daemon
        trap - EXIT
        node "$JEVYR_TREE_GUARD" verify "$JEVYR_ACTION_ROOT" "$JEVYR_RUNTIME_FILESYSTEM"
        node "$JEVYR_TREE_GUARD" verify "$JEVYR_ACTION_ROOT" "$JEVYR_RUNTIME_EXECUTION_FILESYSTEM"
        node "$JEVYR_TREE_GUARD" verify "$JEVYR_SUBJECT_ROOT" "$JEVYR_SUBJECT_FILESYSTEM"
        git_subject() {
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" LANG=C.UTF-8 \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_ATTR_NOSYSTEM=1 \
            GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
            git -c core.fsmonitor=false -c core.hooksPath=/dev/null \
            -C "$JEVYR_SUBJECT_ROOT" "$@"
        }
        JEVYR_SUBJECT_STATUS=$(git_subject status --porcelain=v2 --untracked-files=all --ignore-submodules=none)
        test -z "$JEVYR_SUBJECT_STATUS"
        git_subject ls-files --others --ignored --exclude-standard -z > "$RUNNER_TEMP/jevyr-source-ignored-prepublish"
        test ! -s "$RUNNER_TEMP/jevyr-source-ignored-prepublish"
        {
          git_subject rev-parse --verify 'HEAD^{commit}'
          git_subject rev-parse --verify 'HEAD^{tree}'
          git_subject ls-files --stage -z
          git_subject diff --no-ext-diff --no-textconv --binary HEAD --
          git_subject ls-files --others --exclude-standard -z
        } | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/jevyr-source-prepublish.sha256"
        cmp "$RUNNER_TEMP/jevyr-source-before.sha256" "$RUNNER_TEMP/jevyr-source-prepublish.sha256"
        git_runtime() {
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" LANG=C.UTF-8 \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_ATTR_NOSYSTEM=1 \
            GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
            git -c core.fsmonitor=false -c core.hooksPath=/dev/null \
            -C "$JEVYR_ACTION_ROOT" "$@"
        }
        JEVYR_OBSERVED_RUNTIME_SHA=$(git_runtime rev-parse --verify 'HEAD^{commit}')
        test "$JEVYR_RUNTIME_SHA" = "$JEVYR_OBSERVED_RUNTIME_SHA"
        JEVYR_RUNTIME_STATUS=$(git_runtime status --porcelain=v2 --untracked-files=no --ignore-submodules=none)
        test -z "$JEVYR_RUNTIME_STATUS"
        verify_runtime_control_namespace
        {
          git_runtime rev-parse --verify 'HEAD^{commit}'
          git_runtime rev-parse --verify 'HEAD^{tree}'
          git_runtime ls-files --stage -z
          git_runtime diff --no-ext-diff --no-textconv --binary HEAD --
        } | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/jevyr-runtime-prepublish.sha256"
        cmp "$RUNNER_TEMP/jevyr-runtime-before.sha256" "$RUNNER_TEMP/jevyr-runtime-prepublish.sha256"
        JEVYR_IGNORE_IDENTITY=$(cat "$RUNNER_TEMP/jevyr-ignore-policy.sha256")
        if [[ "$JEVYR_IGNORE_IDENTITY" == "absent" ]]; then
          if [[ -e "$JEVYR_ACTION_ROOT/.jevyrignore" || -L "$JEVYR_ACTION_ROOT/.jevyrignore" ]]; then
            echo "The trusted runtime ignore policy changed before publication." >&2
            exit 1
          fi
          if [[ -e "$JEVYR_SUBJECT_ROOT/.jevyrignore" || -L "$JEVYR_SUBJECT_ROOT/.jevyrignore" ]]; then
            echo "The subject's ignore policy differs from the trusted base before publication." >&2
            exit 1
          fi
        else
          if [[ ! -f "$JEVYR_ACTION_ROOT/.jevyrignore" || -L "$JEVYR_ACTION_ROOT/.jevyrignore" ]]; then
            echo "The trusted runtime ignore policy is invalid before publication." >&2
            exit 1
          fi
          if [[ ! -f "$JEVYR_SUBJECT_ROOT/.jevyrignore" || -L "$JEVYR_SUBJECT_ROOT/.jevyrignore" ]]; then
            echo "The subject's ignore policy is invalid before publication." >&2
            exit 1
          fi
          JEVYR_OBSERVED_IGNORE_IDENTITY=$(sha256sum "$JEVYR_ACTION_ROOT/.jevyrignore" | cut -d' ' -f1)
          test "$JEVYR_IGNORE_IDENTITY" = "$JEVYR_OBSERVED_IGNORE_IDENTITY"
          cmp -s -- "$JEVYR_ACTION_ROOT/.jevyrignore" "$JEVYR_SUBJECT_ROOT/.jevyrignore"
        fi
        private_named_file=$(find "$JEVYR_PUBLIC_DIR" -type f -iname '*private*' -print -quit)
        if test -n "$private_named_file"; then
          echo "Jevyr refused to export a private-key-named file." >&2
          exit 1
        fi
        key_named_file=$(find "$JEVYR_PUBLIC_DIR" -type f \
          \( -iname '*.pem' -o -iname '*.key' -o -iname 'id_rsa*' -o -iname 'id_ed25519*' \
             -o -iname '.env' -o -iname '.env.*' -o -iname '*credentials*' \) -print -quit)
        if test -n "$key_named_file"; then
          echo "Jevyr refused to export a credential-named file." >&2
          exit 1
        fi
        unsafe_entry=$(find "$JEVYR_PUBLIC_DIR" -mindepth 1 \
          \( -type l -o \( -type f -links +1 \) -o \( ! -type f ! -type d \) \) -print -quit)
        if test -n "$unsafe_entry"; then
          echo "Jevyr refused to export a linked or special filesystem entry." >&2
          exit 1
        fi
        credential_scan_status=0
        grep -Ralm1E -- \
          'BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY|github_pat_[A-Za-z0-9_]{40,255}|gh[pousr]_[A-Za-z0-9]{36,255}|AKIA[0-9A-Z]{16}|sk-(proj-)?[A-Za-z0-9_-]{20,}' \
          "$JEVYR_PUBLIC_DIR" >/dev/null || credential_scan_status=$?
        if (( credential_scan_status == 0 )); then
          echo "Jevyr refused a public bundle containing recognizable credential material." >&2
          exit 1
        elif (( credential_scan_status != 1 )); then
          echo "Jevyr could not complete the public-bundle credential scan." >&2
          exit 1
        fi
        (
          cd "$JEVYR_PUBLIC_DIR"
          find . -type f ! -name MANIFEST.sha256 -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum --check MANIFEST.sha256 >/dev/null
        )
        JEVYR_VERIFIED_KEY_ID=$(<"$JEVYR_STATE_DIR/verified-key-id")
        if ! [[ "$JEVYR_VERIFIED_KEY_ID" =~ ^sha256:[a-f0-9]{64}$ ]]; then
          echo "Jevyr did not produce a canonical verified DSSE key ID." >&2
          exit 1
        fi
        jevyr_cli verify-bundle "$JEVYR_PUBLIC_DIR" \
          --trusted-key-id "$JEVYR_VERIFIED_KEY_ID" \
          --expected-runtime-sha "$JEVYR_RUNTIME_SHA" \
          --expected-subject-sha "$JEVYR_EXPECTED_SHA" \
          --expected-workflow-sha "$JEVYR_WORKFLOW_SHA" \
          --json > "$JEVYR_STATE_DIR/bundle-verification.json" \
          2>>"$JEVYR_STATE_DIR/cli.log"
        JEVYR_BUNDLE_ARCHIVE=$(mktemp \
          "$JEVYR_TEMP_ROOT/jevyr-bundle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX.tar")
        LC_ALL=C tar --format=posix --sort=name --mtime='@0' \
          --pax-option=delete=atime,delete=ctime --owner=0 --group=0 --numeric-owner \
          --mode='u+rw,go-rwx' --create --file "$JEVYR_BUNDLE_ARCHIVE" \
          --directory "$JEVYR_PUBLIC_DIR" .
        chmod 0400 "$JEVYR_BUNDLE_ARCHIVE"
        JEVYR_BUNDLE_ARCHIVE_DIGEST="sha256:$(sha256sum < "$JEVYR_BUNDLE_ARCHIVE" | cut -d' ' -f1)"
        JEVYR_ARCHIVE_CHECK_DIR=$(mktemp -d \
          "$JEVYR_TEMP_ROOT/jevyr-archive-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")
        tar --extract --file "$JEVYR_BUNDLE_ARCHIVE" --directory "$JEVYR_ARCHIVE_CHECK_DIR" \
          --no-same-owner --no-same-permissions
        jevyr_cli verify-bundle "$JEVYR_ARCHIVE_CHECK_DIR" \
          --trusted-key-id "$JEVYR_VERIFIED_KEY_ID" \
          --expected-runtime-sha "$JEVYR_RUNTIME_SHA" \
          --expected-subject-sha "$JEVYR_EXPECTED_SHA" \
          --expected-workflow-sha "$JEVYR_WORKFLOW_SHA" \
          --json > "$JEVYR_STATE_DIR/archive-verification.json" \
          2>>"$JEVYR_STATE_DIR/cli.log"
        printf 'case-id=%s\n' "$case_id" >> "$GITHUB_OUTPUT"
        printf 'record-path=%s\n' "$JEVYR_PUBLIC_DIR/record.json" >> "$GITHUB_OUTPUT"
        printf 'record-envelope-path=%s\n' "$JEVYR_PUBLIC_DIR/record.dsse.json" >> "$GITHUB_OUTPUT"
        printf 'terminal-path=%s\n' "$JEVYR_PUBLIC_DIR/terminal.json" >> "$GITHUB_OUTPUT"
        printf 'terminal-envelope-path=%s\n' "$JEVYR_PUBLIC_DIR/terminal.dsse.json" >> "$GITHUB_OUTPUT"
        printf 'replay-path=%s\n' "$JEVYR_PUBLIC_DIR/replay.json" >> "$GITHUB_OUTPUT"
        printf 'public-directory=%s\n' "$JEVYR_PUBLIC_DIR" >> "$GITHUB_OUTPUT"
        printf 'bundle-archive-path=%s\n' "$JEVYR_BUNDLE_ARCHIVE" >> "$GITHUB_OUTPUT"
        printf 'bundle-archive-digest=%s\n' "$JEVYR_BUNDLE_ARCHIVE_DIGEST" >> "$GITHUB_OUTPUT"
        printf 'source-sha=%s\n' "$JEVYR_EXPECTED_SHA" >> "$GITHUB_OUTPUT"
        printf 'runtime-sha=%s\n' "$JEVYR_RUNTIME_SHA" >> "$GITHUB_OUTPUT"
        printf 'key-id=%s\n' "$JEVYR_VERIFIED_KEY_ID" >> "$GITHUB_OUTPUT"

    - name: Prove subject and runtime remained unchanged
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        JEVYR_SUBJECT_ROOT=$(cat "$RUNNER_TEMP/jevyr-subject-root")
        JEVYR_ACTION_ROOT=$(cat "$RUNNER_TEMP/jevyr-action-root")
        JEVYR_TREE_GUARD="$RUNNER_TEMP/jevyr-filesystem-manifest.mjs"
        JEVYR_RUNTIME_FILESYSTEM="$RUNNER_TEMP/jevyr-runtime-filesystem.json"
        JEVYR_RUNTIME_EXECUTION_FILESYSTEM="$RUNNER_TEMP/jevyr-runtime-execution-filesystem.json"
        JEVYR_SUBJECT_FILESYSTEM="$RUNNER_TEMP/jevyr-subject-filesystem.json"
        node "$JEVYR_TREE_GUARD" verify "$JEVYR_ACTION_ROOT" "$JEVYR_RUNTIME_FILESYSTEM"
        node "$JEVYR_TREE_GUARD" verify "$JEVYR_ACTION_ROOT" "$JEVYR_RUNTIME_EXECUTION_FILESYSTEM"
        node "$JEVYR_TREE_GUARD" verify "$JEVYR_SUBJECT_ROOT" "$JEVYR_SUBJECT_FILESYSTEM"
        node "$JEVYR_TREE_GUARD" verify-subtree "$JEVYR_ACTION_ROOT" "$JEVYR_RUNTIME_FILESYSTEM" .jevyr
        git_subject() {
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" LANG=C.UTF-8 \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_ATTR_NOSYSTEM=1 \
            GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
            git -c core.fsmonitor=false -c core.hooksPath=/dev/null \
            -C "$JEVYR_SUBJECT_ROOT" "$@"
        }
        JEVYR_SUBJECT_STATUS=$(git_subject status --porcelain=v2 --untracked-files=all --ignore-submodules=none)
        test -z "$JEVYR_SUBJECT_STATUS"
        git_subject ls-files --others --ignored --exclude-standard -z > "$RUNNER_TEMP/jevyr-source-ignored-final"
        test ! -s "$RUNNER_TEMP/jevyr-source-ignored-final"
        {
          git_subject rev-parse --verify 'HEAD^{commit}'
          git_subject rev-parse --verify 'HEAD^{tree}'
          git_subject ls-files --stage -z
          git_subject diff --no-ext-diff --no-textconv --binary HEAD --
          git_subject ls-files --others --exclude-standard -z
        } | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/jevyr-source-after.sha256"
        cmp "$RUNNER_TEMP/jevyr-source-before.sha256" "$RUNNER_TEMP/jevyr-source-after.sha256"
        JEVYR_RUNTIME_SHA=$(cat "$RUNNER_TEMP/jevyr-runtime-sha")
        git_runtime() {
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" LANG=C.UTF-8 \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_ATTR_NOSYSTEM=1 \
            GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
            git -c core.fsmonitor=false -c core.hooksPath=/dev/null \
            -C "$JEVYR_ACTION_ROOT" "$@"
        }
        JEVYR_OBSERVED_RUNTIME_SHA=$(git_runtime rev-parse --verify 'HEAD^{commit}')
        test "$JEVYR_RUNTIME_SHA" = "$JEVYR_OBSERVED_RUNTIME_SHA"
        JEVYR_RUNTIME_STATUS=$(git_runtime status --porcelain=v2 --untracked-files=no --ignore-submodules=none)
        test -z "$JEVYR_RUNTIME_STATUS"
        JEVYR_RUNTIME_CONTROL_STATUS=$(git_runtime status --porcelain=v2 --untracked-files=all --ignore-submodules=none -- .jevyr)
        if [[ -n "$JEVYR_RUNTIME_CONTROL_STATUS" ]]; then
          echo "The trusted .jevyr authority namespace changed before shutdown." >&2
          exit 1
        fi
        JEVYR_RUNTIME_IGNORED_CONTROLS=$(git_runtime ls-files --others --ignored --exclude-standard -- .jevyr)
        if [[ -n "$JEVYR_RUNTIME_IGNORED_CONTROLS" ]]; then
          echo "The trusted .jevyr authority namespace contains ignored material before shutdown." >&2
          exit 1
        fi
        if [[ -e "$JEVYR_ACTION_ROOT/.jevyr" || -L "$JEVYR_ACTION_ROOT/.jevyr" ]]; then
          if [[ ! -d "$JEVYR_ACTION_ROOT/.jevyr" || -L "$JEVYR_ACTION_ROOT/.jevyr" ]]; then
            echo "The trusted .jevyr authority root is not a real directory before shutdown." >&2
            exit 1
          fi
          JEVYR_RUNTIME_CONTROL_LINK=$(find "$JEVYR_ACTION_ROOT/.jevyr" -type l -print -quit)
          if [[ -n "$JEVYR_RUNTIME_CONTROL_LINK" ]]; then
            echo "The trusted .jevyr authority namespace contains a symbolic link before shutdown." >&2
            exit 1
          fi
        fi
        {
          git_runtime rev-parse --verify 'HEAD^{commit}'
          git_runtime rev-parse --verify 'HEAD^{tree}'
          git_runtime ls-files --stage -z
          git_runtime diff --no-ext-diff --no-textconv --binary HEAD --
        } | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/jevyr-runtime-final.sha256"
        cmp "$RUNNER_TEMP/jevyr-runtime-before.sha256" "$RUNNER_TEMP/jevyr-runtime-final.sha256"
        JEVYR_IGNORE_IDENTITY=$(cat "$RUNNER_TEMP/jevyr-ignore-policy.sha256")
        if [[ "$JEVYR_IGNORE_IDENTITY" == "absent" ]]; then
          if [[ -e "$JEVYR_ACTION_ROOT/.jevyrignore" || -L "$JEVYR_ACTION_ROOT/.jevyrignore" ]]; then
            echo "The trusted runtime ignore policy changed before shutdown." >&2
            exit 1
          fi
          if [[ -e "$JEVYR_SUBJECT_ROOT/.jevyrignore" || -L "$JEVYR_SUBJECT_ROOT/.jevyrignore" ]]; then
            echo "The subject's ignore policy differs from the trusted base before shutdown." >&2
            exit 1
          fi
        else
          if [[ ! -f "$JEVYR_ACTION_ROOT/.jevyrignore" || -L "$JEVYR_ACTION_ROOT/.jevyrignore" ]]; then
            echo "The trusted runtime ignore policy is invalid before shutdown." >&2
            exit 1
          fi
          if [[ ! -f "$JEVYR_SUBJECT_ROOT/.jevyrignore" || -L "$JEVYR_SUBJECT_ROOT/.jevyrignore" ]]; then
            echo "The subject's ignore policy is invalid before shutdown." >&2
            exit 1
          fi
          JEVYR_OBSERVED_IGNORE_IDENTITY=$(sha256sum "$JEVYR_ACTION_ROOT/.jevyrignore" | cut -d' ' -f1)
          test "$JEVYR_IGNORE_IDENTITY" = "$JEVYR_OBSERVED_IGNORE_IDENTITY"
          cmp -s -- "$JEVYR_ACTION_ROOT/.jevyrignore" "$JEVYR_SUBJECT_ROOT/.jevyrignore"
        fi

    - name: Publish verified advisory summary
      if: success()
      shell: bash
      env:
        JEVYR_PUBLIC_RECORD: ${{ steps.run.outputs.record-path }}
        JEVYR_PUBLIC_TERMINAL: ${{ steps.run.outputs.terminal-path }}
        JEVYR_CASE_ID: ${{ steps.run.outputs.case-id }}
        JEVYR_SUBJECT_SHA: ${{ steps.run.outputs.source-sha }}
        JEVYR_RUNTIME_SHA: ${{ steps.run.outputs.runtime-sha }}
        JEVYR_WORKFLOW_SHA: ${{ github.workflow_sha }}
        JEVYR_VERIFIED_KEY_ID: ${{ steps.run.outputs.key-id }}
      run: |
        set -euo pipefail
        umask 077
        env -i PATH="$PATH" HOME="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" LANG=C.UTF-8 \
          JEVYR_PUBLIC_RECORD="$JEVYR_PUBLIC_RECORD" JEVYR_PUBLIC_TERMINAL="$JEVYR_PUBLIC_TERMINAL" \
          JEVYR_CASE_ID="$JEVYR_CASE_ID" JEVYR_SUBJECT_SHA="$JEVYR_SUBJECT_SHA" \
          JEVYR_RUNTIME_SHA="$JEVYR_RUNTIME_SHA" JEVYR_WORKFLOW_SHA="$JEVYR_WORKFLOW_SHA" \
          JEVYR_VERIFIED_KEY_ID="$JEVYR_VERIFIED_KEY_ID" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
          node -e '
          const fs=require("fs");
          const r=JSON.parse(fs.readFileSync(process.env.JEVYR_PUBLIC_RECORD,"utf8"));
          const t=JSON.parse(fs.readFileSync(process.env.JEVYR_PUBLIC_TERMINAL,"utf8"));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Jevyr advisory Record\n\nCase: \`${process.env.JEVYR_CASE_ID}\`  \nWorkflow: \`${process.env.JEVYR_WORKFLOW_SHA}\`  \nRuntime: \`${process.env.JEVYR_RUNTIME_SHA}\`  \nSubject: \`${process.env.JEVYR_SUBJECT_SHA}\`  \nDSSE key: \`${process.env.JEVYR_VERIFIED_KEY_ID}\`  \nIntegrity: **${r.verdict.integrity}**  \nCreation: **${r.verdict.creation}**  \nEmbodiment: **${r.verdict.embodiment}**  \nJudgment: **${r.verdict.judgment}**  \nCrystallization prefix: \`${r.eventHeadDigest}\`  \nSigned terminal head: \`${t.eventHeadDigest}\` (sequence ${t.lastSequence})\n\nThis is advisory evidence, not merge authority. Pin the DSSE key ID or the authenticated GitHub artifact digest before offline verification.\n`);
        '
